name: libojph release

# Builds the libojph binary archives for the same version tags that publish
# the Python wheels (see wheels.yml), names them with that version, and
# attests their build provenance.  Branch pushes never run this workflow.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+rc[0-9]+'

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/libojph.yml

  attest:
    name: Attest the archives
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: libojph-*
          path: dist
          merge-multiple: true

      - name: Check the archive names against the tag
        run: |
          cd dist
          ls -l
          for archive in *; do
            case "$archive" in
              "libojph-$GITHUB_REF_NAME-"*) ;;
              *) echo "$archive is not named for $GITHUB_REF_NAME" >&2; exit 1 ;;
            esac
          done
          sha256sum -- * | tee SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libojph-release
          path: dist/*
          if-no-files-found: error
